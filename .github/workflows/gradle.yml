name: Build and Push Docker Image

on:
  push:
    branches:
      - Master


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
                - name: Validar que DOCKER_USERNAME no está vacío
                run: |
                  if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
                    echo "❌ El secreto DOCKER_USERNAME está vacío o no está configurado."
                    exit 1
                  else
                    echo "✅ Se recibió el secreto DOCKER_USERNAME correctamente."
                  fi

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cont4bl3-backend:latest
