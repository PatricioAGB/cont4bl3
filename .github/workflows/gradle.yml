name: Build and Push Docker Image
#Ejecuta al realizar un push a la rama "Master"
on:
  push:
    branches:
      - Master
#Define un trabajo principal que se ejecuta en el entorno de Ubuntu
jobs:
  build:
    runs-on: ubuntu-latest
    #Clona el codigo de el repositorio
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      #Instala o se utiliza  el Java 21(temurin de eclipse)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
      #Otorga los permiso para utilizar el script de Gradle
      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew
      #Limpia las builds anteriores y genera un nuevo .jar
      - name: Build with Gradle
        run: ./gradlew clean bootJar
      #Sirve para verificar si el jar fue creado
      - name: Verificar JAR generado
        run: ls -lth build/libs/
      #Log in en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      #Permite utilizar multiples arquitecturas
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      #Contruye la imagen Docker y crea la imagen multi arquitectura
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: patricioagb/cont4bl3-backend:latest

