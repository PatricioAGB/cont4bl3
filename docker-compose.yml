version: '3.8'

services:
  sqlserver_db:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: sqlserver_cont4bl3
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Patito531
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cont4bl3-backend
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver_db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver_db:1433;databaseName=contable_db;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=Patito531
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    restart: on-failure
    # Espera unos segundos antes de arrancar (útil si el DB tarda en iniciar)
    entrypoint: ["sh", "-c", "sleep 15 && java -jar app.jar"]

volumes:
  sqlserver_data:
